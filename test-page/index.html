<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Type Right — local test page</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      textarea {
        display: block;
        width: 100%;
        font-family: inherit;
        font-size: 1rem;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      h2 {
        font-size: 1rem;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Type Right — local test page</h1>
    <p>
      Load the built extension unpacked in Chrome, then type into a textarea
      below. Try: <code>I will recieve it</code>
    </p>

    <h2>Plain textarea</h2>
    <textarea rows="4"></textarea>

    <h2>Tall, scrollable textarea</h2>
    <textarea rows="3" style="height: 4rem"></textarea>
  </body>
</html>
